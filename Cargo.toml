[package]
name = "vext-vault"
version = "0.1.2"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# UI Framework
leptos = { version = "0.6.15", features = ["csr"] }

# WASM & JS Interop
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

# Updated web-sys features to support Mobile Touch Sensors and Events
# This is critical to fix the "type mismatch" errors
web-sys = { version = "0.3", features = [
    "Window", 
    "Document", 
    "HtmlElement", 
    "console", 
    "MouseEvent", 
    "TouchEvent", 
    "Event"
] }

# Security & Utils
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-net = { version = "0.5", features = ["http"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.7", features = ["v4", "js"] }
console_error_panic_hook = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

# Production Optimization
[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'