<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 
      THE MOBILE SHIELD (Meta): 
      'user-scalable=no' prevents the phone from zooming in if you tap rapidly 
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VEXT | Institutional Intent Vault</title>
    
    <style>
        /* THE GLOBAL MOBILE SHIELD: 
           Disables tap highlights and long-press menus across the whole app 
        */
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            user-select: none !important;
        }
        
        body { background: #020617; margin: 0; font-family: 'Inter', sans-serif; overflow: hidden; }
    </style>

    <script>
        (function() {
            console.log("🛡️ VEXT: Hardened Inline Bridge Initializing...");
            window.vext = {
                connectWallet: function() {
                    return new Promise((resolve) => {
                        if (!window.solana) { resolve("ERROR_NO_WALLET"); return; }
                        window.solana.connect({ onlyIfTrusted: false })
                            .then(resp => resolve(resp.publicKey.toString()))
                            .catch(() => resolve("ERROR_REJECTED"));
                    });
                },
                signWithHardware: function(challengeHex) {
                    return new Promise((resolve) => {
                        try {
                            const bytes = new Uint8Array(atob(challengeHex).split("").map(c => c.charCodeAt(0)));
                            navigator.credentials.get({
                                publicKey: { challenge: bytes, userVerification: "required", timeout: 60000, rpId: window.location.hostname }
                            }).then(cred => {
                                if (!cred) return resolve(null);
                                const b64 = (b) => window.btoa(String.fromCharCode(...new Uint8Array(b)));
                                resolve({ signature: b64(cred.response.signature), clientData: b64(cred.response.clientDataJSON), authenticatorData: b64(cred.response.authenticatorData) });
                            }).catch(() => resolve(null));
                        } catch (e) { resolve(null); }
                    });
                }
            };
        })();
    </script>
    
    <link rel="rust" data-trunk href="Cargo.toml" />
    <link data-trunk rel="css" href="public/style.css" />
</head>
<body oncontextmenu="return false;">
    <div id="vext-root"></div>
</body>
</html>
