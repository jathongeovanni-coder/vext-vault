<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEXT | Institutional Intent Vault</title>
    
    <!-- Professional UI Styling -->
    <link rel="stylesheet" href="style.css">
    
    <!-- 
      FIXED: We removed 'data-trunk' from the script tag and removed the leading slash.
      We will let Trunk copy this as a static asset from the /public folder.
      This ensures the filename stays exactly 'webauthn_bridge.js' so the 
      Rust engine can find it predictably.
    -->
    <script src="webauthn_bridge.js"></script>
    
    <!-- Standard Trunk link for the Rust logic -->
    <link rel="rust" data-trunk href="Cargo.toml" />
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
</head>
<body style="background: #020617; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; font-family: 'Inter', sans-serif;">
    
    <div id="vext-root" style="width: 100%; display: flex; justify-content: center;"></div>

    <noscript>
        <div style="color: white; text-align: center; padding: 20px;">
            <h1>Institutional Security Requires JavaScript</h1>
            <p>Please enable JS to utilize the VEXT Hardware-Bound Intent Bridge.</p>
        </div>
    </noscript>
</body>
</html>
