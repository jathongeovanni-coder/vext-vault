<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 
      THE VIEWPORT LOCK: 
      'viewport-fit=cover' ensures the app uses the full screen (around the notch).
      'user-scalable=no' prevents the accidental zoom that can push the card off-center.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VEXT | Institutional Intent Vault</title>
    
    <style>
        /* INLINE CENTERING ENGINE: 
           This ensures the card snaps to the center before the main CSS even loads.
        */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #020617;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Stops the side-to-side drifting */
        }
    </style>

    <!-- INLINED HARDENED BRIDGE -->
    <script>
        (function() {
            window.vext = {
                connectWallet: function() {
                    return new Promise((resolve) => {
                        if (!window.solana) { resolve("ERROR_NO_WALLET"); return; }
                        window.solana.connect({ onlyIfTrusted: false })
                            .then(resp => resolve(resp.publicKey.toString()))
                            .catch(() => resolve("ERROR_REJECTED"));
                    });
                },
                signWithHardware: function(challengeHex) {
                    return new Promise((resolve) => {
                        try {
                            const bytes = new Uint8Array(atob(challengeHex).split("").map(c => c.charCodeAt(0)));
                            navigator.credentials.get({
                                publicKey: { 
                                    challenge: bytes, 
                                    userVerification: "required", 
                                    timeout: 60000, 
                                    rpId: window.location.hostname 
                                }
                            }).then(cred => {
                                if (!cred) return resolve(null);
                                const b64 = (b) => window.btoa(String.fromCharCode(...new Uint8Array(b)));
                                resolve({ 
                                    signature: b64(cred.response.signature), 
                                    clientData: b64(cred.response.clientDataJSON), 
                                    authenticatorData: b64(cred.response.authenticatorData) 
                                });
                            }).catch(() => resolve(null));
                        } catch (e) { resolve(null); }
                    });
                }
            };
        })();
    </script>
    
    <!-- Trunk build triggers -->
    <link rel="rust" data-trunk href="Cargo.toml" />
    <link data-trunk rel="css" href="public/style.css" />
</head>
<body oncontextmenu="return false;">
    <div id="vext-root"></div>
</body>
</html>
