[build]
# Points to your main entry file
target = "index.html"

# Where the final "shippable" files go
dist = "dist"

# Ensures Vercel knows where to find the app
public_url = "/"

# This copies everything from /public to the final folder
[[build.copy_public]]
from = "public"

[watch]
ignore = ["dist"]

[serve]
port = 8080
open = false